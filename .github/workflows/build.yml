
name: Build Redmi Resolution Manager APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: 'false'
          packages: ''

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Fix Android 37 SDK directory
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME/platforms/"

          if [ -d "$ANDROID_HOME/platforms/android-37.0" ]; then
            if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
              ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
            fi
          else
            echo "Android 37.0 SDK was not installed"
            exit 1
          fi

          test -d "$ANDROID_HOME/platforms/android-37"
          echo "Android 37 SDK path fixed successfully"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source ZIP
        run: |
          unzip -q Redmi-Resolution-Manager-Gaming-Edition-ADB-v5.zip -d source_unpacked
          test -f source_unpacked/RedmiResolutionManager/settings.gradle
          test -f source_unpacked/RedmiResolutionManager/app/build.gradle

      - name: Update Android build versions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("source_unpacked/RedmiResolutionManager")

          p = root / "build.gradle"
          s = p.read_text()
          s = s.replace("com.android.application' version '8.7.3'", "com.android.application' version '8.7.3'")
          s = s.replace("org.jetbrains.kotlin.android' version '2.0.21'", "org.jetbrains.kotlin.android' version '2.0.21'")
          if "version '8.7.3'" not in s or "version '2.0.21'" not in s:
              raise SystemExit("Plugin versions could not be verified")
          p.write_text(s)

          p = root / "app/build.gradle"
          s = p.read_text().replace("compileSdk 35", "compileSdk 37")
          if "compileSdk 37" not in s:
              raise SystemExit("Could not set compileSdk 37")
          p.write_text(s)

          p = root / "settings.gradle"
          s = p.read_text()
          old = "repositories { google(); mavenCentral() }"
          new = "repositories { google(); mavenCentral(); maven { url 'https://jitpack.io' } }"
          if "https://jitpack.io" not in s:
              if old not in s:
                  raise SystemExit("Could not find dependency repositories")
              s = s.replace(old, new)
          p.write_text(s)

          p = root / "gradle.properties"
          s = p.read_text()
          s = s.replace("android.builtInKotlin=false\n", "")
          p.write_text(s)

          print("Build configuration updated successfully")
          PY

      - name: Build APK
        run: |
          cd source_unpacked/RedmiResolutionManager
          gradle --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Redmi-Resolution-Manager-APK
          path: source_unpacked/RedmiResolutionManager/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
