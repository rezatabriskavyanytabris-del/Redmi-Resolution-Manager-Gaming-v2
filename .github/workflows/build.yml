
name: Build Redmi Resolution Manager APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Prepare diagnostic log
        run: |
          touch build-full.log
          echo "Build started" | tee -a build-full.log

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        shell: bash
        run: |
          set -e

          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
              -type f -name sdkmanager | sort -V | tail -n 1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "Using SDK manager: $SDKMANAGER"

          "$SDKMANAGER" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +e
          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses
          true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0"

          echo "Android SDK packages installed"

      - name: Prepare Android 37 SDK
        shell: bash
        run: |
          set -e

          SRC="$ANDROID_HOME/platforms/android-37.0"
          DST="$ANDROID_HOME/platforms/android-37"

          test -f "$SRC/android.jar"

          rm -rf "$DST"
          cp -a "$SRC" "$DST"

          python3 - <<'PY'
          from pathlib import Path
          import os

          root = Path(os.environ["ANDROID_HOME"]) / "platforms" / "android-37"

          for name in ("source.properties", "package.xml"):
              p = root / name

              if p.exists():
                  content = p.read_text()
                  content = content.replace(
                      "platforms;android-37.0",
                      "platforms;android-37"
                  )
                  p.write_text(content)

          print("Android 37 SDK prepared")
          PY

          test -f "$DST/android.jar"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Check source ZIP
        shell: bash
        run: |
          set -e

          ls -lah

          test -f Redmi-Resolution-Manager-Gaming-Edition-ADB-v5.zip

      - name: Extract source
        shell: bash
        run: |
          set -e

          mkdir -p source_unpacked

          unzip -q \
            Redmi-Resolution-Manager-Gaming-Edition-ADB-v5.zip \
            -d source_unpacked

          ROOT="source_unpacked/RedmiResolutionManager"

          test -f "$ROOT/settings.gradle"
          test -f "$ROOT/build.gradle"
          test -f "$ROOT/app/build.gradle"

          echo "Source extracted successfully"

      - name: Configure Android and Kotlin
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("source_unpacked/RedmiResolutionManager")

          p = root / "build.gradle"
          s = p.read_text()

          s = s.replace(
              "com.android.application' version '8.7.3'",
              "com.android.application' version '9.1.1'"
          )

          if "com.android.application' version '9.1.1'" not in s:
              raise SystemExit("Could not configure Android Gradle Plugin")

          lines = [
              line for line in s.splitlines()
              if "org.jetbrains.kotlin.android" not in line
          ]

          s = "\n".join(lines)

          marker = (
              "id 'com.android.application' version '9.1.1' apply false"
          )

          replacement = (
              marker
              + "\n    id 'org.jetbrains.kotlin.android' "
              + "version '2.4.20' apply false"
          )

          s = s.replace(marker, replacement)

          if "org.jetbrains.kotlin.android" not in s:
              raise SystemExit("Kotlin plugin configuration failed")

          p.write_text(s + "\n")

          p = root / "app/build.gradle"
          s = p.read_text()

          lines = [
              line for line in s.splitlines()
              if "org.jetbrains.kotlin.android" not in line
          ]

          s = "\n".join(lines) + "\n"

          s = s.replace(
              "id 'com.android.application'",
              "id 'com.android.application'\n    "
              "id 'org.jetbrains.kotlin.android'"
          )

          s = s.replace("compileSdk 35", "compileSdk 37")

          if "compileSdk 37" not in s:
              raise SystemExit("compileSdk configuration failed")

          if "sourceCompatibility JavaVersion.VERSION_17" not in s:
              s += """
          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          """

          if 'jvmTarget = "17"' not in s:
              s += """
          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          """

          p.write_text(s)

          p = root / "settings.gradle"
          s = p.read_text()

          if "https://jitpack.io" not in s:
              old = "repositories { google(); mavenCentral() }"

              new = (
                  "repositories { google(); mavenCentral(); "
                  "maven { url 'https://jitpack.io' } }"
              )

              if old not in s:
                  raise SystemExit("Dependency repositories not found")

              s = s.replace(old, new)

          p.write_text(s)

          p = root / "gradle.properties"
          s = p.read_text()

          lines = [
              line for line in s.splitlines()
              if not line.startswith("android.builtInKotlin=")
              and not line.startswith("android.newDsl=")
          ]

          lines.extend([
              "android.builtInKotlin=false",
              "android.newDsl=false"
          ])

          p.write_text("\n".join(lines) + "\n")

          print("Project configuration completed")
          PY

      - name: Verify build environment
        shell: bash
        run: |
          set -e

          java -version
          gradle --version

          echo "Android platforms:"
          ls "$ANDROID_HOME/platforms"

          cat source_unpacked/RedmiResolutionManager/app/build.gradle

      - name: Build APK
        shell: bash
        run: |
          cd source_unpacked/RedmiResolutionManager

          set +e

          gradle --no-daemon clean assembleDebug \
            --stacktrace \
            --info \
            --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/build-full.log"

          BUILD_STATUS=${PIPESTATUS[0]}

          echo "BUILD_STATUS=$BUILD_STATUS"

          exit "$BUILD_STATUS"

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Build-Diagnostic-Log
          path: build-full.log
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: Redmi-Resolution-Manager-APK
          path: source_unpacked/RedmiResolutionManager/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
