
name: Build Redmi Resolution Manager APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: 'false'
          packages: ''

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Fix Android 37 SDK package metadata
        run: |
          SDK="$ANDROID_HOME"
          SRC="$SDK/platforms/android-37.0"
          DST="$SDK/platforms/android-37"

          test -d "$SRC"
          rm -rf "$DST"
          cp -a "$SRC" "$DST"

          python3 - <<'PY'
          from pathlib import Path
          import os

          root = Path(os.environ["ANDROID_HOME"]) / "platforms" / "android-37"

          for name in ("source.properties", "package.xml"):
              p = root / name
              if p.exists():
                  s = p.read_text()
                  s = s.replace("platforms;android-37.0", "platforms;android-37")
                  p.write_text(s)

          print("Android 37 SDK prepared")
          PY

          test -f "$DST/android.jar"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Extract source ZIP
        run: |
          unzip -q Redmi-Resolution-Manager-Gaming-Edition-ADB-v5.zip -d source_unpacked
          test -f source_unpacked/RedmiResolutionManager/settings.gradle
          test -f source_unpacked/RedmiResolutionManager/app/build.gradle

      - name: Configure AGP and Kotlin 2.4.20
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("source_unpacked/RedmiResolutionManager")

          p = root / "build.gradle"
          s = p.read_text()

          s = s.replace(
              "com.android.application' version '8.7.3'",
              "com.android.application' version '9.1.1'"
          )

          if "com.android.application' version '9.1.1'" not in s:
              raise SystemExit("Could not configure AGP 9.1.1")

          lines = [
              line for line in s.splitlines()
              if "org.jetbrains.kotlin.android" not in line
          ]

          s = "\n".join(lines)

          s = s.replace(
              "id 'com.android.application' version '9.1.1' apply false",
              "id 'com.android.application' version '9.1.1' apply false\n    id 'org.jetbrains.kotlin.android' version '2.4.20' apply false"
          )

          if "org.jetbrains.kotlin.android" not in s:
              raise SystemExit("Could not add Kotlin 2.4.20 plugin")

          p.write_text(s + "\n")

          p = root / "app/build.gradle"
          s = p.read_text()

          lines = [
              line for line in s.splitlines()
              if "org.jetbrains.kotlin.android" not in line
          ]

          s = "\n".join(lines) + "\n"

          s = s.replace(
              "id 'com.android.application'",
              "id 'com.android.application'\n    id 'org.jetbrains.kotlin.android'"
          )

          s = s.replace("compileSdk 35", "compileSdk 37")

          if "compileSdk 37" not in s:
              raise SystemExit("compileSdk 37 configuration failed")

          p.write_text(s)

          p = root / "settings.gradle"
          s = p.read_text()

          old = "repositories { google(); mavenCentral() }"
          new = "repositories { google(); mavenCentral(); maven { url 'https://jitpack.io' } }"

          if "https://jitpack.io" not in s:
              if old not in s:
                  raise SystemExit("Could not find dependency repositories")
              s = s.replace(old, new)

          p.write_text(s)

          p = root / "gradle.properties"
          s = p.read_text()

          lines = [
              line for line in s.splitlines()
              if not line.startswith("android.builtInKotlin=")
              and not line.startswith("android.newDsl=")
          ]

          lines.append("android.builtInKotlin=false")
          lines.append("android.newDsl=false")

          p.write_text("\n".join(lines) + "\n")

          print("AGP 9.1.1 + Kotlin 2.4.20 configured")
          print("Android new DSL disabled for Kotlin plugin compatibility")
          PY

      - name: Verify build configuration
        run: |
          echo "Root build.gradle:"
          cat source_unpacked/RedmiResolutionManager/build.gradle
          echo "App build.gradle:"
          cat source_unpacked/RedmiResolutionManager/app/build.gradle
          echo "Gradle properties:"
          cat source_unpacked/RedmiResolutionManager/gradle.properties

      - name: Build APK
        run: |
          cd source_unpacked/RedmiResolutionManager
          gradle --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Redmi-Resolution-Manager-APK
          path: source_unpacked/RedmiResolutionManager/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
