
package com.rezadev.resolutionmanager

import android.content.Context
import com.flyfishxu.kadb.Kadb
import kotlinx.coroutines.CoroutineScope
import kotlinx.coroutines.Dispatchers
import kotlinx.coroutines.SupervisorJob
import kotlinx.coroutines.launch
import java.util.function.Consumer

/** Internal Wireless Debugging ADB bridge. */
object ADBBridge {

    private val scope = CoroutineScope(SupervisorJob() + Dispatchers.IO)

    @JvmStatic
    fun pairAndConnect(
        context: Context,
        host: String,
        pairingPort: Int,
        pairingCode: String,
        connectPort: Int,
        success: Consumer<String>,
        failure: Consumer<String>
    ) {
        scope.launch {
            try {
                Kadb.pair(host, pairingPort, pairingCode)

                Kadb.create(host, connectPort).use { adb ->
                    val result = adb.shell("echo RRM_ADB_CONNECTED")

                    if (result.exitCode != 0 ||
                        !result.output.contains("RRM_ADB_CONNECTED")) {
                        throw IllegalStateException(
                            result.output.ifBlank {
                                "ADB connection verification failed"
                            }
                        )
                    }
                }

                context.getSharedPreferences(
                    "adb",
                    Context.MODE_PRIVATE
                ).edit()
                    .putString("host", host)
                    .putInt("port", connectPort)
                    .apply()

                success.accept("ADB داخلی متصل شد")

            } catch (t: Throwable) {
                failure.accept(
                    t.message ?: t.javaClass.simpleName
                )
            }
        }
    }

    @JvmStatic
    fun shell(
        host: String,
        port: Int,
        command: String,
        success: Consumer<String>,
        failure: Consumer<String>
    ) {
        scope.launch {
            try {
                Kadb.create(host, port).use { adb ->
                    val result = adb.shell(command)

                    if (result.exitCode != 0) {
                        throw IllegalStateException(
                            result.output.ifBlank {
                                "Command failed"
                            }
                        )
                    }

                    success.accept(result.output)
                }

            } catch (t: Throwable) {
                failure.accept(
                    t.message ?: t.javaClass.simpleName
                )
            }
        }
    }
}
