
name: Build Redmi Resolution Manager APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: 'false'
          packages: ''

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Fix Android 37 SDK package metadata
        run: |
          SDK="$ANDROID_HOME"
          SRC="$SDK/platforms/android-37.0"
          DST="$SDK/platforms/android-37"

          test -d "$SRC"

          rm -f "$DST"
          rm -rf "$DST"

          cp -a "$SRC" "$DST"

          python3 - <<'PY'
          from pathlib import Path

          root = Path.home() / "Android" / "Sdk"
          import os
          root = Path(os.environ["ANDROID_HOME"]) / "platforms" / "android-37"

          p = root / "source.properties"
          if p.exists():
              s = p.read_text()
              s = s.replace("platforms;android-37.0", "platforms;android-37")
              p.write_text(s)

          p = root / "package.xml"
          if p.exists():
              s = p.read_text()
              s = s.replace("platforms;android-37.0", "platforms;android-37")
              p.write_text(s)

          print("Android 37 SDK metadata updated")
          PY

          test -f "$DST/android.jar"
          echo "Android 37 SDK is ready"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source ZIP
        run: |
          unzip -q Redmi-Resolution-Manager-Gaming-Edition-ADB-v5.zip -d source_unpacked
          test -f source_unpacked/RedmiResolutionManager/settings.gradle
          test -f source_unpacked/RedmiResolutionManager/app/build.gradle

      - name: Update Android build versions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("source_unpacked/RedmiResolutionManager")

          p = root / "build.gradle"
          s = p.read_text()
          s = s.replace("com.android.application' version '8.7.3'", "com.android.application' version '8.7.3'")
          s = s.replace("org.jetbrains.kotlin.android' version '2.0.21'", "org.jetbrains.kotlin.android' version '2.0.21'")
          p.write_text(s)

          p = root / "app/build.gradle"
          s = p.read_text().replace("compileSdk 35", "compileSdk 37")
          if "compileSdk 37" not in s:
              raise SystemExit("Could not set compileSdk 37")
          p.write_text(s)

          p = root / "settings.gradle"
          s = p.read_text()
          old = "repositories { google(); mavenCentral() }"
          new = "repositories { google(); mavenCentral(); maven { url 'https://jitpack.io' } }"
          if "https://jitpack.io" not in s:
              if old not in s:
                  raise SystemExit("Could not find dependency repositories")
              s = s.replace(old, new)
          p.write_text(s)

          p = root / "gradle.properties"
          s = p.read_text()
          s = s.replace("android.builtInKotlin=false\n", "")
          if "android.suppressUnsupportedCompileSdk=37" not in s:
              s += "\nandroid.suppressUnsupportedCompileSdk=37\n"
          p.write_text(s)

          print("Project configuration updated")
          PY

      - name: Build APK
        run: |
          cd source_unpacked/RedmiResolutionManager
          gradle --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Redmi-Resolution-Manager-APK
          path: source_unpacked/RedmiResolutionManager/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
