
name: Build Redmi Resolution Manager APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: 'false'

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0"

      - name: Prepare Android 37 SDK
        shell: bash
        run: |
          set -e

          SDK="$ANDROID_HOME"
          SRC="$SDK/platforms/android-37.0"
          DST="$SDK/platforms/android-37"

          test -f "$SRC/android.jar"

          rm -rf "$DST"
          cp -a "$SRC" "$DST"

          python3 - <<'PY'
          from pathlib import Path
          import os

          root = Path(os.environ["ANDROID_HOME"]) / "platforms" / "android-37"

          for name in ("source.properties", "package.xml"):
              p = root / name
              if p.exists():
                  content = p.read_text()
                  content = content.replace(
                      "platforms;android-37.0",
                      "platforms;android-37"
                  )
                  p.write_text(content)

          print("Android SDK 37 prepared")
          PY

          test -f "$DST/android.jar"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Check source ZIP
        run: |
          set -e
          ls -lh
          test -f Redmi-Resolution-Manager-Gaming-Edition-ADB-v5.zip

      - name: Extract source
        run: |
          set -e
          unzip -q Redmi-Resolution-Manager-Gaming-Edition-ADB-v5.zip -d source_unpacked

          test -f source_unpacked/RedmiResolutionManager/settings.gradle
          test -f source_unpacked/RedmiResolutionManager/build.gradle
          test -f source_unpacked/RedmiResolutionManager/app/build.gradle

      - name: Configure Android and Kotlin
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("source_unpacked/RedmiResolutionManager")

          # Root Gradle configuration
          p = root / "build.gradle"
          s = p.read_text()

          s = s.replace(
              "com.android.application' version '8.7.3'",
              "com.android.application' version '9.1.1'"
          )

          if "com.android.application' version '9.1.1'" not in s:
              raise SystemExit("AGP version could not be updated")

          lines = [
              line for line in s.splitlines()
              if "org.jetbrains.kotlin.android" not in line
          ]

          s = "\n".join(lines)

          marker = (
              "id 'com.android.application' version '9.1.1' apply false"
          )

          replacement = (
              marker
              + "\n    id 'org.jetbrains.kotlin.android' "
              + "version '2.4.20' apply false"
          )

          s = s.replace(marker, replacement)

          if "org.jetbrains.kotlin.android" not in s:
              raise SystemExit("Kotlin plugin configuration failed")

          p.write_text(s + "\n")

          # App Gradle configuration
          p = root / "app/build.gradle"
          s = p.read_text()

          lines = [
              line for line in s.splitlines()
              if "org.jetbrains.kotlin.android" not in line
          ]

          s = "\n".join(lines) + "\n"

          s = s.replace(
              "id 'com.android.application'",
              "id 'com.android.application'\n    "
              "id 'org.jetbrains.kotlin.android'"
          )

          s = s.replace("compileSdk 35", "compileSdk 37")

          if "compileSdk 37" not in s:
              raise SystemExit("compileSdk configuration failed")

          if "sourceCompatibility JavaVersion.VERSION_17" not in s:
              s += """
          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          """

          if 'jvmTarget = "17"' not in s:
              s += """
          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          """

          p.write_text(s)

          # JitPack repository
          p = root / "settings.gradle"
          s = p.read_text()

          if "https://jitpack.io" not in s:
              old = "repositories { google(); mavenCentral() }"
              new = (
                  "repositories { google(); mavenCentral(); "
                  "maven { url 'https://jitpack.io' } }"
              )

              if old not in s:
                  raise SystemExit("Dependency repositories not found")

              s = s.replace(old, new)

          p.write_text(s)

          # Gradle properties
          p = root / "gradle.properties"
          s = p.read_text()

          lines = [
              line for line in s.splitlines()
              if not line.startswith("android.builtInKotlin=")
              and not line.startswith("android.newDsl=")
          ]

          lines.extend([
              "android.builtInKotlin=false",
              "android.newDsl=false"
          ])

          p.write_text("\n".join(lines) + "\n")

          print("Build configuration completed")
          PY

      - name: Verify Java and Kotlin targets
        run: |
          echo "Java:"
          java -version

          echo "Gradle:"
          gradle --version

          echo "App configuration:"
          cat source_unpacked/RedmiResolutionManager/app/build.gradle

      - name: Build APK
        shell: bash
        run: |
          cd source_unpacked/RedmiResolutionManager

          set +e

          gradle --no-daemon clean assembleDebug \
            --stacktrace \
            --info \
            --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/build-full.log"

          BUILD_STATUS=${PIPESTATUS[0]}

          echo "BUILD_STATUS=$BUILD_STATUS"

          exit "$BUILD_STATUS"

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Diagnostic-Log
          path: build-full.log
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Redmi-Resolution-Manager-APK
          path: source_unpacked/RedmiResolutionManager/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
