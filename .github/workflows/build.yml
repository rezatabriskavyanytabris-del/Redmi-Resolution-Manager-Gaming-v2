
name: Build Redmi Resolution Manager APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: 'false'
          packages: ''

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK 37
        run: |
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Extract source ZIP
        run: |
          unzip -q Redmi-Resolution-Manager-Gaming-Edition-ADB-v5.zip -d source_unpacked
          test -f source_unpacked/RedmiResolutionManager/settings.gradle
          test -f source_unpacked/RedmiResolutionManager/app/build.gradle

      - name: Update Android build versions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("source_unpacked/RedmiResolutionManager")

          p = root / "build.gradle"
          s = p.read_text()
          s = s.replace("com.android.application' version '8.7.3'", "com.android.application' version '9.1.1'")
          s = s.replace("org.jetbrains.kotlin.android' version '2.0.21'", "org.jetbrains.kotlin.android' version '2.2.10'")
          if "version '9.1.1'" not in s or "version '2.2.10'" not in s:
              raise SystemExit("Could not update root plugin versions")
          p.write_text(s)

          p = root / "app/build.gradle"
          s = p.read_text().replace("compileSdk 35", "compileSdk 37")
          if "compileSdk 37" not in s:
              raise SystemExit("Could not update compileSdk")
          p.write_text(s)

          p = root / "settings.gradle"
          s = p.read_text()
          old = "repositories { google(); mavenCentral() }"
          new = "repositories { google(); mavenCentral(); maven { url 'https://jitpack.io' } }"
          if old not in s:
              raise SystemExit("Could not find dependency repositories")
          p.write_text(s.replace(old, new))

          p = root / "gradle.properties"
          s = p.read_text()
          if "android.builtInKotlin=false" not in s:
              s += "\nandroid.builtInKotlin=false\n"
          p.write_text(s)

          print("Android build configuration updated")
          PY

      - name: Build APK
        run: |
          cd source_unpacked/RedmiResolutionManager
          gradle --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Redmi-Resolution-Manager-APK
          path: source_unpacked/RedmiResolutionManager/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
